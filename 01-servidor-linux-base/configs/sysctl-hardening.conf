# ==============================================================================
# Optimizaciones de Kernel y Red para Servidores Linux Domésticos 24/7
# ==============================================================================
# Ubicación en el sistema: /etc/sysctl.d/99-homelab-hardening.conf
# Aplicar cambios en vivo: sudo sysctl --system
# ==============================================================================

# 1. GESTIÓN DE MEMORIA Y SWAP
# Evita swap agresivo en disco NVMe/SSD, protegiendo las celdas de memoria flash.
vm.swappiness = 10
# Mejora la liberación de inodos y dentry caches.
vm.vfs_cache_pressure = 50
# Previene congelamientos por escritura masiva retrasada en discos externos.
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10

# 2. CONTROL DE CONGESTIÓN TCP Y VELOCIDAD DE RED
# BBR (Bottleneck Bandwidth and RTT) ofrece un rendimiento muy superior a Cubic en descargas.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# 3. AMPLIACIÓN DE BUFFERS DE RED (Requerido para Jellyfin y descargas a 1 Gbps)
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
net.core.netdev_max_backlog = 10000

# 4. HARDENING Y SEGURIDAD DE RED
# Ignorar peticiones ICMP broadcast (anti Smurf attack)
net.ipv4.icmp_echo_ignore_broadcasts = 1
# Protección contra ataques SYN Flood
net.ipv4.tcp_syncookies = 1
# Rechazar paquetes con enrutamiento de origen
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
# Desactivar redirecciones ICMP (previene ataques MITM)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
# Comprobación de ruta inversa estricta (anti-spoofing)
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# 5. RECURSOS DEL SISTEMA PARA CONTENEDORES (Docker / Inotify)
# Aumenta el límite de observadores de archivos (esencial para Sonarr, Radarr y Playwright)
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
fs.file-max = 2097152
